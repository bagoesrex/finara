name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, build, and browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      DATABASE_URL: postgresql://finara_ci:finara_ci_only@127.0.0.1:5432/finara_ci?schema=public
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: finara-ci-only-secret-that-is-not-used-outside-actions

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finara_ci
          POSTGRES_USER: finara_ci
          POSTGRES_PASSWORD: finara_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finara_ci -d finara_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install frozen dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate:deploy

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: PostgreSQL integration checks
        run: npm run test:integration

      # Prisma's CLI-only optional peer graph currently carries an upstream
      # advisory without a compatible upgrade; audit the deployed graph here.
      - name: Dependency audit
        run: npm audit --omit=dev --omit=optional --omit=peer --audit-level=high

      - name: Production build
        run: npm run build

      - name: Install Microsoft Edge for Playwright
        run: npx playwright install --with-deps msedge

      - name: Mobile Edge browser tests
        run: npx playwright test --project=mobile-edge

      - name: Upload browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
